plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.bitcam'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'app.bitcam'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '2.2'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        // Chave fixa no repositório para que builds novos atualizem o app instalado.
        // Serve para instalar por fora da loja; não use para publicar na Play Store.
        sideload {
            storeFile rootProject.file('bitcam.keystore')
            storePassword 'bitcam'
            keyAlias 'bitcam'
            keyPassword 'bitcam'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { checkReleaseBuilds false }
}
